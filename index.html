<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu bản thân - Sweet112</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #38bdf8;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 16px;
        }
        p.bio {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-btn {
            background-color: #334155;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .link-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Sweet112" alt="Avatar">
        <h1>Xin chào, mình là Sweet112</h1>
        <div class="subtitle">Developer / Tech Enthusiast</div>
        <p class="bio">
            Chào mừng bạn đến với trang cá nhân của mình. Đây là nơi chia sẻ các dự án, sở thích công nghệ và các thông tin liên hệ.
        </p>
        <div class="links">
            <a href="https://facebook.com" target="_blank" class="link-btn">Facebook</a>
            <a href="https://github.com" target="_blank" class="link-btn">GitHub</a>
            <a href="mailto:email@example.com" class="link-btn">Gửi Email</a>
        </div>
    </div>
</body>
</html>
